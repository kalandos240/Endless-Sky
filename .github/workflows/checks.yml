name: Port checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test deterministic resource packages
        run: python -m unittest discover -s tests -v
      - name: Generate cross-language fixtures
        run: python tests/make_installer_fixtures.py
      - name: Test the production Java installer
        run: |
          mkdir -p build/java-tests
          javac -Xlint:all -Werror -d build/java-tests android/app/src/main/java/io/github/kalandos240/endlesssky/ResourceInstaller.java tests/java/ResourceInstallerTest.java
          java -cp build/java-tests io.github.kalandos240.endlesssky.ResourceInstallerTest build/installer-fixtures
      - name: Test portable pilot backups and restore recovery
        run: |
          mkdir -p build/backup-tests
          javac -Xlint:all -Werror -d build/java-tests android/app/src/main/java/io/github/kalandos240/endlesssky/SaveBackup.java tests/java/SaveBackupTest.java
          java -cp build/java-tests io.github.kalandos240.endlesssky.SaveBackupTest build/backup-tests
      - name: Test multi-touch pointer ownership
        run: |
          javac -Xlint:all -Werror -d build/java-tests android/app/src/main/java/io/github/kalandos240/endlesssky/TouchActions.java android/app/src/main/java/io/github/kalandos240/endlesssky/TouchInputState.java tests/java/TouchInputStateTest.java
          java -cp build/java-tests io.github.kalandos240.endlesssky.TouchInputStateTest
      - name: Test 150-second interstitial scheduling policy
        run: |
          javac -Xlint:all -Werror -d build/java-tests android/app/src/main/java/io/github/kalandos240/endlesssky/AdSchedule.java tests/java/AdScheduleTest.java
          java -cp build/java-tests io.github.kalandos240.endlesssky.AdScheduleTest
      - name: Test stable advertising opportunities
        run: |
          javac -Xlint:all -Werror -d build/java-tests android/app/src/main/java/io/github/kalandos240/endlesssky/AdOpportunity.java tests/java/AdOpportunityTest.java
          java -cp build/java-tests io.github.kalandos240.endlesssky.AdOpportunityTest
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -I android/native tests/native/AdBreakStateTest.cpp -o build/ad-break-state-test
          build/ad-break-state-test
      - name: Test native touch state and frame transitions
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -I android/native tests/native/TouchStateTest.cpp -o build/touch-state-test
          build/touch-state-test
      - name: Verify upstream patches and repeatability
        run: |
          python tools/prepare_upstream.py
          python tools/prepare_upstream.py
          git -C build/upstream diff --check
