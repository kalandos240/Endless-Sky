plugins {
    id 'com.android.application'
}

def portRoot = rootProject.projectDir.parentFile
def sourceRoot = new File(portRoot, 'build/upstream')
def sdlRoot = new File(portRoot, 'build/sdl2')
def vcpkgRoot = new File(portRoot, 'build/vcpkg')
def assetsRoot = new File(portRoot, 'build/android-assets')

// Supply a publisher-owned key outside the checkout. Never fall back to debug signing.
def releaseSigning = [
    storeFile: System.getenv('ES_RELEASE_STORE_FILE'),
    storePassword: System.getenv('ES_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('ES_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('ES_RELEASE_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }

def adsMode = providers.gradleProperty('esAds').getOrElse('none')
if (!(adsMode in ['none', 'yandexTest', 'yandex'])) {
    throw new GradleException('esAds must be none, yandexTest or yandex')
}
def yandexTestAds = adsMode == 'yandexTest'
def yandexAds = adsMode != 'none'

android {
    namespace 'io.github.kalandos240.endlesssky'
    buildFeatures { buildConfig true }
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        // Development ID; confirm the permanent store ID before the first release.
        applicationId 'io.github.kalandos240.endlesssky'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'YANDEX_AD_UNIT', '"demo-interstitial-yandex"'
        resValue 'string', 'ads_notice', yandexAds ? 'Создано с использованием Yandex Mobile Ads SDK' : ''
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                        "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                        '-DVCPKG_TARGET_TRIPLET=arm64-android-es',
                        "-DVCPKG_OVERLAY_TRIPLETS=${portRoot}/android/native/triplets",
                        "-DVCPKG_MANIFEST_DIR=${portRoot}/android/native",
                        "-DVCPKG_INSTALLED_DIR=${portRoot}/build/vcpkg-installed",
                        '-DANDROID_STL=c++_shared', '-DBUILD_TESTING=OFF'
                targets 'EndlessSky'
            }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeType System.getenv('ES_RELEASE_STORE_TYPE') ?: 'PKCS12'
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
        }
        release {
            signingConfig signingConfigs.release
            if (adsMode == 'yandex') {
                buildConfigField 'String', 'YANDEX_AD_UNIT', '"R-M-20312738-1"'
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDir yandexAds ? 'src/yandex/java' : 'src/noAds/java'
            if (yandexAds) manifest.srcFile 'src/yandex/AndroidManifest.xml'
            java.srcDir new File(sdlRoot, 'android-project/app/src/main/java')
            assets.srcDir assetsRoot
            if (yandexAds) assets.srcDir 'src/yandex/assets'
            res.srcDir new File(portRoot, 'build/android-res')
        }
    }
    androidResources {
        // The ZIP is already compressed; this also permits efficient asset access.
        noCompress += ['zip']
    }
    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.31.6'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging false }
    }
}

tasks.register('checkPreparedSources') {
    doLast {
        [new File(sourceRoot, 'CMakeLists.txt'),
         new File(sdlRoot, 'android-project/app/src/main/java/org/libsdl/app/SDLActivity.java'),
         new File(vcpkgRoot, 'scripts/buildsystems/vcpkg.cmake'),
         new File(assetsRoot, 'resources.manifest'),
         new File(assetsRoot, 'resources.zip')].each { required ->
            if (!required.isFile()) {
                throw new GradleException('Run python3 tools/prepare_android.py from the repository root first. Missing: ' + required)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkPreparedSources' }

// Ship the notices belonging to the exact native dependencies used in this APK.
android.applicationVariants.all { variant ->
    def cap = variant.name.capitalize()
    def licenseDirectory = layout.buildDirectory.dir("generated/legalAssets/${variant.name}")
    def collectLicenses = tasks.register("collect${cap}NativeLicenses", Sync) {
        dependsOn "externalNativeBuild${cap}"
        from(new File(portRoot, 'build/vcpkg-installed/arm64-android-es/share')) {
            include '**/copyright'
            into 'licenses/vcpkg'
        }
        into licenseDirectory
    }
    android.sourceSets.getByName(variant.name).assets.srcDir licenseDirectory
    tasks.named("merge${cap}Assets").configure { dependsOn collectLicenses }
}

// Keep debug builds usable without secrets, but reject unsigned release APKs and bundles.
tasks.register('checkReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing requires ES_RELEASE_STORE_FILE, ES_RELEASE_STORE_PASSWORD, ES_RELEASE_KEY_ALIAS and ES_RELEASE_KEY_PASSWORD.')
        }
        if (!rootProject.file(releaseSigning.storeFile).isFile()) {
            throw new GradleException('Release keystore file is missing.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn 'checkReleaseSigning'
    }
}

if (yandexAds) {
    dependencies { implementation 'com.yandex.android:mobileads:8.6.0' }
}

if (yandexTestAds) {
    // The demo-only mode must not accidentally become a store release.
    tasks.configureEach { task ->
        if (task.name == 'preReleaseBuild') {
            task.doFirst { throw new GradleException('yandexTest is debug-only; use esAds=yandex for a signed release.') }
        }
    }
}
